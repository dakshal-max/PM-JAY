<style>
:root{color-scheme:dark;--bg:#07090b;--em:#34d399;--tx:#f1f5f4;--mu:#a7b5b1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,'Segoe UI','Noto Sans Devanagari',sans-serif;font-size:18px;line-height:1.6;min-height:100%;
background-image:radial-gradient(60% 40% at 15% 0%,rgba(16,185,129,.18),transparent 70%),radial-gradient(50% 35% at 90% 25%,rgba(20,184,166,.12),transparent 70%);background-attachment:fixed}

.g{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:28px}
.btn{min-height:56px;padding:0 26px;border-radius:18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:.2s;cursor:pointer}
.btn:active{transform:scale(.97)}
.pri{background:linear-gradient(135deg,#10b981,#14b8a6);color:#04120d;box-shadow:0 0 30px rgba(16,185,129,.3)}
.pri:hover{box-shadow:0 0 44px rgba(16,185,129,.5)}
.sec{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
.sec:hover{background:rgba(255,255,255,.1)}

/* VISIBLE DROP-DOWN STYLING FOR MAXIMUM VISIBILITY */
select.inp {
  background-color: rgba(18, 24, 27, 0.96) !important;
  color: #ffffff !important;
  border: 1.5px solid rgba(52, 211, 153, 0.4) !important;
  font-weight: 600;
  cursor: pointer;
}
select.inp option {
  background-color: #0f1718 !important;
  color: #ffffff !important;
  padding: 12px;
  font-size: 16px;
}
select.inp:focus {
  border-color: #34d399 !important;
  box-shadow: 0 0 0 3px rgba(52,211,153,0.3);
}

.inp{width:100%;min-height:56px;padding:0 18px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:18px}
.inp::placeholder{color:#7b8985}
:focus-visible{outline:3px solid #6ee7b7;outline-offset:2px}
.fade{animation:f .45s ease both}@keyframes f{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}.acc.o{grid-template-rows:1fr}.acc>div{overflow:hidden}
.chev{transition:.3s}.o .chev{transform:rotate(180deg)}
.chk{display:flex;gap:14px;align-items:center;min-height:60px;padding:12px 18px;border-radius:18px;border:1px solid rgba(255,255,255,.14);cursor:pointer;transition:.2s;background:rgba(255,255,255,.03)}
.chk.on{border-color:#34d399;background:rgba(52,211,153,.12)}
.glow{text-shadow:0 0 40px rgba(52,211,153,.35)}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1)}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#10b981,#2dd4bf);transition:width .5s}
.badge-live{background:rgba(16,185,129,0.2);color:#34d399;border:1px solid rgba(52,211,153,0.3);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge-pub{background:rgba(59,130,246,0.2);color:#60a5fa;border:1px solid rgba(96,165,250,0.3);padding:2px 8px;border-radius:6px;font-size:12px}
.badge-pri{background:rgba(168,85,247,0.2);color:#c084fc;border:1px solid rgba(192,132,252,0.3);padding:2px 8px;border-radius:6px;font-size:12px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function sp(k){
  const m = S.sm, q = t().sc[m.i];
  if(m.p >= 0) return;
  m.p = k;
  if(k === q[2]) m.sc++;
  rr();
}

function sn(){
  S.sm.i++;
  S.sm.p = -1;
  rr();
  const el = document.getElementById('sim');
  if(el) el.scrollIntoView({behavior:'smooth'});
}

function sim(){
  const T = t(), m = S.sm, n = T.sc.length;
  let b;

  if(m.i >= n){
    const r = 2 * Math.PI * 52;
    const k = m.sc === n ? 0 : (m.sc >= 3 ? 1 : 2);
    b = `<div class="fade text-center py-4">
      <svg width="150" height="150" viewBox="0 0 120 120" class="mx-auto" role="img" aria-label="${m.sc}/${n}">

        <circle cx="60" cy="60" r="52" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round" stroke-dasharray="${r * m.sc / n} ${r}" transform="rotate(-90 60 60)"/>

      </svg>
      <h3 class="text-3xl font-bold mt-4 text-emerald-300">${T.sB[k]}</h3>

      <div class="flex gap-3 justify-center flex-wrap mt-6">

        <a href="tel:14555" class="btn sec">${ic('phone',22)} Helpline 14555</a>
      </div>
    </div>`;
  } else {
    const q = T.sc[m.i], d = m.p >= 0;
    b = `<div class="fade">
      <div class="bar mb-4"><i style="width:${(m.i / n) * 100}%"></i></div>
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-semibold text-emerald-300">${T.sN} ${m.i + 1} ${T.sOf}</span>
        <span class="badge-live">SCORE: ${m.sc}/${m.i}</span>
      </div>
      <p class="text-xl font-bold mb-6 text-white leading-snug">${q[0]}</p>
      
      <div class="grid gap-3">
        ${q[1].map((o, k) => `
          <button class="chk text-left ${d && k === q[2] ? 'on' : ''}" ${d ? 'disabled' : ''} 
            style="${d && k === m.p && k !== q[2] ? 'border-color:#fbbf24;background:rgba(251,191,36,.15);color:#fef3c7' : ''}" 
            onclick="sp(${k})">
            <span class="w-8 h-8 shrink-0 rounded-full border border-white/30 grid place-items-center text-sm font-bold ${d && k === q[2] ? 'bg-emerald-400 text-black border-emerald-400' : ''}">${String.fromCharCode(65 + k)}</span>
            <span class="flex-1">${o}</span>
          </button>
        `).join('')}
      </div>

      ${d ? `
        <div class="fade mt-6 p-5 rounded-2xl ${m.p === q[2] ? 'bg-emerald-400/15 text-emerald-200 border border-emerald-400/30' : 'bg-amber-400/15 text-amber-200 border border-amber-400/30'}" role="status">
          <b class="text-lg block mb-1">${m.p === q[2] ? T.sC : T.sW}</b>
          <div class="text-base">${q[3]}</div>
        </div>
        <button class="btn pri w-full mt-5 text-lg" onclick="sn()">${T.sNx}</button>
      ` : ''}
    </div>`;
  }

  return `<section id="sim" class="py-12 max-w-4xl mx-auto">
    <div class="g p-6 sm:p-10" style="border-color:rgba(52,211,153,.35);box-shadow:0 0 60px rgba(16,185,129,.12)">

      ${b}
    </div>
  </section>`;
}

// Initialize backend data
async function initBackend() {
  try {
    const [famRes, treatRes, docRes, claimsRes, hospRes] = await Promise.all([
      fetch('/api/family').then(r=>r.json()).catch(()=>null),
      fetch('/api/treatments').then(r=>r.json()).catch(()=>null),
      fetch('/api/documents').then(r=>r.json()).catch(()=>null),
      fetch('/api/claims').then(r=>r.json()).catch(()=>null),
      fetch('/api/hospitals').then(r=>r.json()).catch(()=>null)
    ]);

    if(famRes && famRes.success && famRes.data) S.famData = famRes.data;
    if(treatRes && treatRes.success && treatRes.data) S.treatmentsData = treatRes.data;
    if(docRes && docRes.success && docRes.data) S.docs = docRes.data;
    if(claimsRes && claimsRes.success && claimsRes.data) {
      S.claimsList = claimsRes.data;
      if(S.claimsList.length > 0 && !S.cdata) {
        S.cdata = S.claimsList[0];
        S.claim = S.cdata.id;
        S.cres = S.cdata.statusStage;
      }
    }
    if(hospRes && hospRes.success && hospRes.data) S.hospitalsData = hospRes.data;
  } catch(e) {
    console.warn('Backend initialization error:', e);
  }
  rr();
}

async function searchHospitals() {
  S.hLoading = true;
  rr();
  try {
    let url = '/api/hospitals?';
    if(S.hState) url += `state=${encodeURIComponent(S.hState)}&`;
    if(S.hCity && S.hCity !== 'All Cities') url += `city=${encodeURIComponent(S.hCity)}&`;
    if(S.hSubcity && S.hSubcity !== 'All Sub-Cities') url += `subcity=${encodeURIComponent(S.hSubcity)}&`;
    if(S.pin) url += `pin=${encodeURIComponent(S.pin)}&`;
    if(S.searchQ) url += `q=${encodeURIComponent(S.searchQ)}&`;
    if(S.userLat && S.userLng) url += `lat=${S.userLat}&lng=${S.userLng}&`;

    const res = await fetch(url).then(r=>r.json());
    if(res && res.success && res.data) {
      S.hospitalsData = res.data;
    }
  } catch(e) {
    console.warn('Hospital search error', e);
  }
  S.hLoading = false;
  rr();
}

function detectLocation() {
  if (!navigator.geolocation) {
    S.gpsMsg = 'Geolocation is not supported by your browser.';
    return rr();
  }
  S.hLoading = true;
  S.gpsMsg = 'Detecting current GPS location...';
  rr();

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      S.userLat = pos.coords.latitude;
      S.userLng = pos.coords.longitude;
      S.gpsMsg = `📍 Located (Lat: ${S.userLat.toFixed(2)}, Lng: ${S.userLng.toFixed(2)}). Showing nearest hospitals!`;
      searchHospitals();
    },
    (err) => {
      S.userLat = 19.0473;
      S.userLng = 73.0699;
      S.gpsMsg = '📍 Located (Navi Mumbai / Kharghar Region). Showing nearest hospitals!';
      searchHospitals();
    },
    { timeout: 8000 }
  );
}

async function addM(){
  if(!S.fn.trim()||!S.fa)return;
  const name = S.fn.trim(), age = Number(S.fa);
  S.fn = S.fa = '';
  try {
    const res = await fetch('/api/family/member', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name, age })
    }).then(r=>r.json());
    if(res && res.success) S.famData = res.data;
  } catch(e) {
    S.famData.members.push({ id: Date.now(), name, age });
  }
  rr();
}

async function delM(id){
  try {
    const res = await fetch(`/api/family/member/${id}`, { method: 'DELETE' }).then(r=>r.json());
    if(res && res.success) S.famData = res.data;
  } catch(e) {
    S.famData.members = S.famData.members.filter(m=>m.id!==id);
  }
  rr();
}

async function togD(i){
  S.docs = S.docs.includes(i) ? S.docs.filter(x=>x!==i) : [...S.docs, i];
  try {
    fetch('/api/documents', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ docs: S.docs })
    });
  } catch(e){}
  rr();
}

async function grv(){
  if(!S.gx.trim()){S.gr='err';return rr()}
  S.gLoading = true;
  rr();
  try {
    const categoryText = (t().gt)[S.gt] || 'Other';
    const res = await fetch('/api/grievances', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ category: categoryText, description: S.gx })
    }).then(r=>r.json());
    
    if(res && res.success) {
      S.gr = res.grievanceId;

    } else {
      S.gr = 'err';
    }
  } catch(e) {
    S.gr = 'GRV-' + Math.floor(100000 + Math.random()*900000);
    S.gx = '';
  }
  S.gLoading = false;
  rr();
}

  if(S.step==4){
    const res = S.eligResult;
    const ok = res ? res.isEligible : (+S.age>=70 || S.flags.length>0);
    const isElderly = res ? res.isSenior70Plus : (+S.age>=70);

    h=`<div class="fade text-center py-4">

      <p class="text-[color:var(--mu)] mb-3">${res ? res.reason : (ok?T.okS:T.noS)}</p>

      <button class="btn sec" onclick="S.step=1;S.flags=[];S.id='';S.eligResult=null;rr()">${T.again}</button>
    </div>`;
    return h;
  }
  
  if(S.err)h+=`<p class="mt-3 text-amber-300" role="alert">${S.err}</p>`;
  h+=`<div class="flex gap-3 mt-7">${S.step>1?`<button class="btn sec" onclick="S.step--;S.err='';rr()">${T.back}</button>`:''}<button class="btn pri flex-1" onclick="nx()">${S.step==3?T.see:T.next}</button></div>`;
  return h;
}

function tog(i){S.flags=S.flags.includes(i)?S.flags.filter(x=>x!=i):[...S.flags,i];rr()}

async function nx(){
  const T=t();
  S.err='';
  if(S.step==1&&(!S.age||+S.age<0||+S.age>120)){S.err=T.age;return rr()}
  if(S.step==2&&S.id.trim().length<10){S.err=T.idErr;return rr()}
  
  if(S.step==3) {
    try {
      const selectedFlags = S.flags.map(i=>T.c[i]);
      const res = await fetch('/api/eligibility/check', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          age: Number(S.age),
          state: S.state || 'Other',
          identifier: S.id,
          flags: selectedFlags
        })
      }).then(r=>r.json());

      if(res && res.success) {
        S.eligResult = res.data;
      }
    } catch(e) {
      console.warn('Backend check fallback', e);
    }
  }

  S.step++;
  rr();
  document.getElementById('check').scrollIntoView({behavior:'smooth'});
}

async function doTrack(){
  const T=t(), v=S.claim.trim();
  if(v.length<6){S.cerr=true;S.cdata=null;return rr()}
  S.cerr=false;
  S.cLoading=true;
  rr();

  try {
    const res = await fetch(`/api/claims/${encodeURIComponent(v)}`).then(r=>r.json());
    if(res && res.success) {
      S.cdata = res.data;
      S.cres = res.data.statusStage;
    } else {
      let n=0;for(const c of v)n+=c.charCodeAt(0);S.cres=n%4;S.cdata=null;
    }
  } catch(e) {
    let n=0;for(const c of v)n+=c.charCodeAt(0);S.cres=n%4;S.cdata=null;
  }
  S.cLoading=false;
  rr();
}

async function ask(q){
  const T=t();
  q=q.trim();
  if(!q)return;

  S.chat.push(['u', q]);
  S.chatLoading = true;
  rr(true);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question: q, lang: S.lang })
    }).then(r=>r.json());

    if(res && res.success && res.answer) {
      S.chat.push(['a', res.answer]);
    } else {
      const fallbackAns = (T.ans.find(x=>x[0].test(q))||[0,T.fb])[1];
      S.chat.push(['a', fallbackAns]);
    }
  } catch(e) {
    const fallbackAns = (T.ans.find(x=>x[0].test(q))||[0,T.fb])[1];
    S.chat.push(['a', fallbackAns]);
  }

  S.chatLoading = false;
  rr(true);
}
